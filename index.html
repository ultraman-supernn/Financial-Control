<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Keuangan Pro</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-body: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-masuk: #10b981;
            --accent-keluar: #f43f5e;
            --accent-primary: #6366f1;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 16px; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; }
        
        /* Header */
        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { font-size: 22px; font-weight: 700; margin: 0; background: linear-gradient(to right, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-sub); font-size: 13px; margin-top: 4px; }

        /* Kartu Utama Saldo */
        .balance-card {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            padding: 20px; border-radius: 20px; text-align: center;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); margin-bottom: 16px;
        }
        .balance-card span { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }
        .balance-card h1 { font-size: 30px; font-weight: 700; margin: 8px 0 0; }

        /* Kartu Ringkasan */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .summary-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); padding: 16px; border-radius: 16px; backdrop-filter: blur(10px); }
        .summary-card .icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 14px; }
        .summary-card.masuk .icon { background: rgba(16, 185, 129, 0.15); color: var(--accent-masuk); }
        .summary-card.keluar .icon { background: rgba(244, 63, 94, 0.15); color: var(--accent-keluar); }
        .summary-card span { font-size: 12px; color: var(--text-sub); display: block; }
        .summary-card p { font-size: 16px; font-weight: 600; margin: 4px 0 0; }

        /* Grafik Card */
        .chart-box { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); padding: 16px; border-radius: 16px; margin-bottom: 20px; }
        .chart-container { position: relative; height: 180px; width: 100%; display: flex; justify-content: center; }

        /* Form Card */
        .form-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .form-card h3 { font-size: 15px; margin: 0 0 16px; font-weight: 600; color: var(--text-main); }
        .input-group { margin-bottom: 12px; }
        .input-group label { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .btn-submit { width: 100%; padding: 12px; background: var(--accent-primary); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }

        /* History List */
        .history-section h3 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); padding: 14px 16px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; }
        .history-left { display: flex; align-items: center; gap: 12px; }
        .history-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .item-masuk .history-icon { background: rgba(16, 185, 129, 0.15); color: var(--accent-masuk); }
        .item-keluar .history-icon { background: rgba(244, 63, 94, 0.15); color: var(--accent-keluar); }
        .history-title { font-weight: 600; font-size: 14px; }
        .history-date { font-size: 11px; color: var(--text-sub); }
        .history-right { text-align: right; }
        .history-amount { font-weight: 700; font-size: 14px; }
        .history-amount.masuk { color: var(--accent-masuk); }
        .history-amount.keluar { color: var(--accent-keluar); }
        .btn-del { background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 12px; margin-left: 8px; }
        .btn-del:hover { color: var(--accent-keluar); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fa-solid fa-wallet"></i> KeuanganKu Pro</h2>
        <p>Atur alur kas dompetmu dengan mudah</p>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
        <span>Total Saldo Saat Ini</span>
        <h1 id="totalSaldo">Rp 0</h1>
    </div>

    <!-- Summary Grid -->
    <div class="summary-grid">
        <div class="summary-card masuk">
            <div class="icon"><i class="fa-solid fa-arrow-down-left"></i></div>
            <span>Pemasukan</span>
            <p id="totalMasuk" style="color: var(--accent-masuk)">Rp 0</p>
        </div>
        <div class="summary-card keluar">
            <div class="icon"><i class="fa-solid fa-arrow-up-right"></i></div>
            <span>Pengeluaran</span>
            <p id="totalKeluar" style="color: var(--accent-keluar)">Rp 0</p>
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-box">
        <div class="chart-container">
            <canvas id="keuanganChart"></canvas>
        </div>
    </div>

    <!-- Input Form -->
    <div class="form-card">
        <h3><i class="fa-solid fa-circle-plus"></i> Transaksi Baru</h3>
        <form id="formTransaksi">
            <div class="input-group">
                <label>Keterangan</label>
                <input type="text" id="deskripsi" placeholder="Misal: Gaji Bulanan, Beli Kopi" required>
            </div>
            <div class="input-group">
                <label>Nominal (Rp)</label>
                <input type="number" id="jumlah" placeholder="0" required>
            </div>
            <div class="input-group">
                <label>Jenis Transaksi</label>
                <select id="jenis">
                    <option value="masuk">Uang Masuk (+)</option>
                    <option value="keluar">Uang Keluar (-)</option>
                </select>
            </div>
            <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> Simpan Transaksi</button>
        </form>
    </div>

    <!-- History -->
    <div class="history-section">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Transaksi</h3>
        <div class="history-list" id="daftarRiwayat"></div>
    </div>
</div>

<script>
    let transaksi = JSON.parse(localStorage.getItem('dataKeuanganPro')) || [];
    let myChart = null;

    function formatRupiah(angka) {
        return "Rp " + Number(angka).toLocaleString('id-ID');
    }

    function initChart(masuk, keluar) {
        const ctx = document.getElementById('keuanganChart').getContext('2d');
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Pemasukan', 'Pengeluaran'],
                datasets: [{
                    data: [masuk, keluar],
                    backgroundColor: ['#10b981', '#f43f5e'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#f8fafc', font: { family: 'Plus Jakarta Sans' } } }
                },
                cutout: '70%'
            }
        });
    }

    function updateDashboard() {
        let totalSaldo = 0, totalMasuk = 0, totalKeluar = 0;
        const daftarRiwayat = document.getElementById('daftarRiwayat');
        daftarRiwayat.innerHTML = '';

        if (transaksi.length === 0) {
            daftarRiwayat.innerHTML = `<p style="text-align:center; color: var(--text-sub); font-size:13px; margin:20px 0;">Belum ada riwayat transaksi</p>`;
        }

        transaksi.forEach((item, index) => {
            if (item.jenis === 'masuk') {
                totalMasuk += item.jumlah;
                totalSaldo += item.jumlah;
            } else {
                totalKeluar += item.jumlah;
                totalSaldo -= item.jumlah;
            }

            const isMasuk = item.jenis === 'masuk';
            const div = document.createElement('div');
            div.className = `history-item ${isMasuk ? 'item-masuk' : 'item-keluar'}`;
            
            div.innerHTML = `
                <div class="history-left">
                    <div class="history-icon">
                        <i class="fa-solid ${isMasuk ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                    </div>
                    <div>
                        <div class="history-title">${item.deskripsi}</div>
                        <div class="history-date">${item.tanggal || 'Baru Saja'}</div>
                    </div>
                </div>
                <div class="history-right">
                    <span class="history-amount ${isMasuk ? 'masuk' : 'keluar'}">
                        ${isMasuk ? '+' : '-'} ${formatRupiah(item.jumlah)}
                    </span>
                    <button class="btn-del" onclick="hapusTransaksi(${index})"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `;
            daftarRiwayat.appendChild(div);
        });

        document.getElementById('totalSaldo').innerText = formatRupiah(totalSaldo);
        document.getElementById('totalMasuk').innerText = formatRupiah(totalMasuk);
        document.getElementById('totalKeluar').innerText = formatRupiah(totalKeluar);

        initChart(totalMasuk, totalKeluar);
    }

    function simpanData() {
        localStorage.setItem('dataKeuanganPro', JSON.stringify(transaksi));
    }

    document.getElementById('formTransaksi').addEventListener('submit', function(e) {
        e.preventDefault();
        const deskripsi = document.getElementById('deskripsi').value;
        const jumlah = parseFloat(document.getElementById('jumlah').value);
        const jenis = document.getElementById('jenis').value;

        if (!deskripsi.trim() || isNaN(jumlah) || jumlah <= 0) return;

        const now = new Date();
        const tanggal = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

        transaksi.unshift({ deskripsi, jumlah, jenis, tanggal });
        simpanData();
        updateDashboard();
        document.getElementById('formTransaksi').reset();
    });

    function hapusTransaksi(index) {
        transaksi.splice(index, 1);
        simpanData();
        updateDashboard();
    }

    updateDashboard();
</script>

</body>
</html>
